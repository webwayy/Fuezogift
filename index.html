<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Loyalty Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6F2932;
            --primary-dark: #4A1B22;
            --gold: #FFB800;
            --gold-light: #FFF8E7;
            --bg: #F3F4F6;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
            --success: #10B981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
        }

        .container { width: 100%; max-width: 420px; }

        .card-container {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            padding: 28px 22px;
            border: 1px solid rgba(229, 231, 235, 0.8);
            position: relative;
            overflow: hidden;
        }

        .card-header { text-align: center; margin-bottom: 22px; }

        .brand-name {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #a23a48);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .login-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #F9FAFB;
            padding: 6px;
            border-radius: 16px;
            border: 1px solid #E5E7EB;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
            background: #ffffff;
            color: var(--text-dark);
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(111, 41, 50, 0.1);
        }

        .login-box .input-field { border: none; background: transparent; }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 13px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(111, 41, 50, 0.2);
        }

        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(111, 41, 50, 0.3); }
        .btn-check { width: auto; white-space: nowrap; padding: 10px 18px; }

        .cust-profile {
            background: linear-gradient(135deg, #FFF5F6, #FDEDF0);
            border: 1px solid rgba(111, 41, 50, 0.12);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 22px;
        }

        .cust-profile h4 { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
        .cust-profile p { font-size: 12px; color: var(--text-muted); font-weight: 500; }

        .stamp-grid { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 22px; }

        .stamp-slot {
            flex: 1;
            aspect-ratio: 1;
            background: #F3F4F6;
            border: 2px dashed #D1D5DB;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #9CA3AF;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stamp-slot.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: 2px solid var(--primary);
            color: #ffffff;
            transform: scale(1.06);
            box-shadow: 0 6px 14px rgba(111, 41, 50, 0.25);
        }

        .stamp-slot.gift-slot { border-color: var(--gold); background: var(--gold-light); color: var(--gold); }

        .stamp-slot.gift-slot.active {
            background: linear-gradient(135deg, #FFB800, #F59E0B);
            color: #ffffff;
            animation: pulse-gift 1.2s infinite alternate;
        }

        @keyframes pulse-gift {
            from { transform: scale(1.05); box-shadow: 0 4px 12px rgba(255, 184, 0, 0.4); }
            to { transform: scale(1.15); box-shadow: 0 8px 24px rgba(255, 184, 0, 0.7); }
        }

        .status-box {
            background: #F9FAFB;
            padding: 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 18px;
            border: 1px solid #E5E7EB;
            color: var(--text-muted);
        }

        .reward-unlocked {
            display: none;
            background: linear-gradient(135deg, #ECFDF5, #D1FAE5);
            color: #065F46;
            padding: 22px 18px;
            border-radius: 20px;
            border: 2px solid #34D399;
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            margin-bottom: 18px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2);
            position: relative;
            overflow: hidden;
        }

        .reward-unlocked.animate-pop {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.6) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .gift-icon-anim {
            font-size: 38px;
            display: inline-block;
            margin-bottom: 6px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .gift-title-text {
            font-size: 17px;
            color: #047857;
            margin: 10px 0 14px 0;
            display: block;
            background: #ffffff;
            padding: 12px;
            border-radius: 14px;
            border: 1px dashed #34D399;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }

        .btn-claim {
            background: linear-gradient(135deg, #10B981, #059669);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            transform: scale(0.8) translateY(20px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-icon {
            font-size: 42px;
            margin-bottom: 12px;
            display: inline-block;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .modal-text {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .btn-modal-cancel {
            background: #F1F5F9;
            color: var(--text-dark);
            box-shadow: none;
        }

        .btn-modal-cancel:hover { background: #E2E8F0; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="container">
    <div class="card-container">
        <div class="card-header">
            <div class="brand-name">Fuezogift</div>
            <div class="card-title">Customer Loyalty Card</div>
        </div>

        <div class="login-box">
            <input type="tel" id="searchPhone" class="input-field" placeholder="Mobile Number">
            <button class="btn btn-check" onclick="loadCustomerCard()">Check Card</button>
        </div>

        <div class="cust-profile">
            <h4 id="display-name">Customer: Enter Phone</h4>
            <p id="display-phone">Phone: --</p>
            <p id="display-amount" style="margin-top:4px; font-weight:700; color:var(--primary);">Last Bill: ₹0</p>
        </div>

        <div class="stamp-grid">
            <div class="stamp-slot" id="slot-1">1</div>
            <div class="stamp-slot" id="slot-2">2</div>
            <div class="stamp-slot" id="slot-3">3</div>
            <div class="stamp-slot" id="slot-4">4</div>
            <div class="stamp-slot gift-slot" id="slot-5">🎁</div>
        </div>

        <div id="status-message" class="status-box">Enter phone number above to view your card</div>

        <div id="reward-message" class="reward-unlocked">
            <div class="gift-icon-anim">🎉 🎁 🎉</div><br>
            <span style="font-size:13px; font-weight:600; color:#047857;">CONGRATULATIONS! YOU UNLOCKED:</span>
            <strong class="gift-title-text" id="gift-name-display">--</strong>
            <button class="btn btn-claim" onclick="openClaimModal()">🎁 Claim Gift & Reset Card</button>
        </div>

        <div id="request-section" class="input-group">
            <input type="text" id="custName" class="input-field" placeholder="Your Name">
            <input type="number" id="billAmount" class="input-field" placeholder="Bill Amount (₹)">
            <button class="btn" onclick="sendStampRequest()">📩 Request Stamp</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="customModal">
    <div class="modal-card">
        <div class="modal-icon" id="modalIcon">⚠️</div>
        <div class="modal-title" id="modalTitle">Notification</div>
        <div class="modal-text" id="modalText">Message goes here...</div>
        <div class="modal-actions" id="modalActions">
            <button class="btn" onclick="closeModal()">OK</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCfpExFFKCSBCQM21T1...",
        authDomain: "fuezogift.firebaseapp.com",
        databaseURL: "https://fuezogift-default-rtdb.firebaseio.com",
        projectId: "fuezogift",
        storageBucket: "fuezogift.firebasestorage.app",
        messagingSenderId: "308068716118",
        appId: "1:308068716118:web:d085f8...",
        measurementId: "G-FYR51N21FC"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let configuredGiftBelow = "Standard Gift 🎁";
    let configuredGiftAbove = "Premium Dessert Waffle 🧇";

    let currentPhone = "";
    let customerData = { name: "", lastAmount: 0, totalSpent: 0, stamps: 0, gift: "" };
    let hasTriggeredConfetti = false;
    let customerListener = null;
    let requestListener = null;

    window.onload = function() {
        // Auto fetch phone from URL parameter (?phone=9876543210)
        const urlParams = new URLSearchParams(window.location.search);
        const phoneParam = urlParams.get('phone');
        
        if (phoneParam) {
            const clean = sanitizePhone(phoneParam);
            document.getElementById('searchPhone').value = clean;
            loadCustomerCard();
        }

        database.ref('settings/gifts').on('value', (snapshot) => {
            if (snapshot.exists()) {
                const gifts = snapshot.val();
                if (gifts.below1000) configuredGiftBelow = gifts.below1000;
                if (gifts.above1000) configuredGiftAbove = gifts.above1000;
            }
        });
    };

    function sanitizePhone(phone) {
        return phone ? phone.toString().replace(/\D/g, '') : '';
    }

    function showCustomModal(icon, title, message, actionsHtml) {
        document.getElementById('modalIcon').innerText = icon;
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalText').innerText = message;
        
        const actionsContainer = document.getElementById('modalActions');
        if (actionsHtml) {
            actionsContainer.innerHTML = actionsHtml;
        } else {
            actionsContainer.innerHTML = `<button class="btn" onclick="closeModal()">OK</button>`;
        }
        
        document.getElementById('customModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('customModal').classList.remove('active');
    }

    function loadCustomerCard() {
        const rawPhone = document.getElementById('searchPhone').value.trim();
        const phone = sanitizePhone(rawPhone);

        if (!phone || phone.length < 10) {
            showCustomModal('📱', 'Invalid Phone Number', 'Please enter a valid 10-digit mobile number to check your loyalty card.');
            return;
        }

        if (currentPhone !== phone) {
            hasTriggeredConfetti = false;
            // Detach previous listeners if active
            if (currentPhone) {
                database.ref('customers/' + currentPhone).off();
                database.ref('requests/' + currentPhone).off();
            }
        }

        currentPhone = phone;

        database.ref('customers/' + currentPhone).on('value', (snapshot) => {
            if (snapshot.exists()) {
                customerData = snapshot.val();
                if (customerData.name) {
                    document.getElementById('custName').value = customerData.name;
                }
            } else {
                customerData = { name: "", lastAmount: 0, totalSpent: 0, stamps: 0, gift: "" };
            }
            checkPendingAndRender();
        });
    }

    function checkPendingAndRender() {
        database.ref('requests/' + currentPhone).on('value', (snapshot) => {
            const myPending = snapshot.exists() ? snapshot.val() : null;
            updateUI(myPending);
        });
    }

    function determineGiftName(totalSpent) {
        const total = parseFloat(totalSpent) || 0;
        return total >= 1000 ? configuredGiftAbove : configuredGiftBelow;
    }

    function triggerCelebration() {
        if (typeof confetti === 'function') {
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        }
    }

    function updateUI(myPending) {
        document.getElementById('display-name').innerText = "Customer: " + (customerData.name || (currentPhone ? "New Customer" : "Please Enter Phone"));
        document.getElementById('display-phone').innerText = "Phone: " + (currentPhone || "--");
        document.getElementById('display-amount').innerText = "Last Bill: ₹" + (customerData.lastAmount || 0);

        for (let i = 1; i <= 5; i++) {
            const slot = document.getElementById(`slot-${i}`);
            if (i <= customerData.stamps) {
                slot.classList.add('active');
                slot.innerText = (i === 5) ? "🎁" : "✓";
            } else {
                slot.classList.remove('active');
                slot.innerText = (i === 5) ? "🎁" : i;
            }
        }

        const statusMsg = document.getElementById('status-message');
        const rewardMsg = document.getElementById('reward-message');
        const giftDisplay = document.getElementById('gift-name-display');
        const reqSection = document.getElementById('request-section');

        if (!currentPhone) {
            statusMsg.style.display = 'block';
            rewardMsg.style.display = 'none';
            reqSection.style.display = 'flex';
            statusMsg.innerHTML = "Enter phone number above to check card.";
            return;
        }

        if (customerData.stamps < 5) {
            statusMsg.style.display = 'block';
            rewardMsg.style.display = 'none';
            rewardMsg.classList.remove('animate-pop');
            reqSection.style.display = 'flex';
            if (myPending) {
                statusMsg.innerHTML = `<span style="color:#D97706;">⏳ Stamp Request Sent for ₹${myPending.amount}! Waiting for Approval...</span>`;
            } else {
                const rem = 5 - customerData.stamps;
                statusMsg.innerHTML = `Collect <b>${rem}</b> more stamp${rem > 1 ? 's' : ''} to unlock Gift!`;
            }
        } else {
            statusMsg.style.display = 'none';
            rewardMsg.style.display = 'block';
            reqSection.style.display = 'none';
            
            const finalGift = customerData.gift || determineGiftName(customerData.totalSpent);
            giftDisplay.innerText = "🎁 " + finalGift;

            if (!hasTriggeredConfetti) {
                rewardMsg.classList.add('animate-pop');
                triggerCelebration();
                hasTriggeredConfetti = true;
            }
        }
    }

    function sendStampRequest() {
        const rawPhone = document.getElementById('searchPhone').value.trim();
        const phone = sanitizePhone(rawPhone);
        const name = document.getElementById('custName').value.trim();
        const amount = parseFloat(document.getElementById('billAmount').value);

        if (!phone || phone.length < 10) {
            showCustomModal('📲', 'Phone Number Missing', 'Please enter a valid 10-digit mobile number at the top before sending a request.');
            return;
        }

        if (!name || isNaN(amount) || amount <= 0) {
            showCustomModal('✏️', 'Incomplete Details', 'Please enter your Name and a valid Bill Amount.');
            return;
        }

        currentPhone = phone;

        database.ref('requests/' + phone).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                showCustomModal('⏳', 'Request Pending', 'You already have a pending stamp request! Please wait for approval.');
                return;
            }

            database.ref('requests/' + phone).set({
                phone: phone,
                name: name,
                amount: amount,
                timestamp: Date.now()
            }, (error) => {
                if (error) {
                    showCustomModal('❌', 'Error', error.message);
                } else {
                    document.getElementById('billAmount').value = "";
                    loadCustomerCard();
                    showCustomModal('✅', 'Request Sent!', 'Your stamp request has been sent to the cashier successfully.');
                }
            });
        });
    }

    function openClaimModal() {
        const actions = `
            <button class="btn btn-modal-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn btn-claim" onclick="confirmClaimAndReset()">Yes, Claim!</button>
        `;
        showCustomModal('🎉', 'Claim Your Gift?', 'Have you received your gift from the counter? Proceeding will reset your stamps for a new card.', actions);
    }

    function confirmClaimAndReset() {
        closeModal();
        if (!currentPhone) return;

        database.ref('customers/' + currentPhone).update({
            stamps: 0,
            totalSpent: 0,
            lastAmount: 0,
            gift: ""
        }, (error) => {
            if (error) {
                showCustomModal('❌', 'Error', error.message);
            } else {
                hasTriggeredConfetti = false;
                showCustomModal('✨', 'Card Reset!', 'Congratulations! Your loyalty card has been reset for new stamps.');
            }
        });
    }
</script>

</body>
</html>
